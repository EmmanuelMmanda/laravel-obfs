name: Laravel compatibility

on:
  push:
  pull_request:

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '7', php: '7.4' }
          - { laravel: '8', php: '7.4' }
          - { laravel: '9', php: '8.0' }
          - { laravel: '10', php: '8.1' }
          - { laravel: '11', php: '8.2' }
          - { laravel: '12', php: '8.2' }
          - { laravel: '12', php: '8.3' }
          - { laravel: '12', php: '8.4' }
          - { laravel: '12', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Permit legacy framework install in test fixture
        if: matrix.laravel == '7' || matrix.laravel == '8' || matrix.laravel == '9'
        run: composer config --global policy.advisories.block false
      - name: Create Laravel application
        run: composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" /tmp/obfs-app --no-interaction --no-progress
      - name: Install package from checkout
        working-directory: /tmp/obfs-app
        run: |
          composer config repositories.local path "$GITHUB_WORKSPACE"
          composer require 'mmanda/laravel-obfs:@dev' -W --no-interaction --no-progress
      - name: Exercise Laravel 12 commands
        if: matrix.laravel == '12'
        run: php "$GITHUB_WORKSPACE/tests/integration.php" /tmp/obfs-app
